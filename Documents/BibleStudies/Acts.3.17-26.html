<div class="question"><p><strong>Q1. What is vincible ignorance?</strong></p>
<label><input type="radio" name="q1" value="a"> a) Defensible ignorance.</label><br>
<label><input type="radio" name="q1" value="b"> b) Indefensible ignorance.</label><br>
<label><input type="radio" name="q1" value="c"> c) Ignorance of the law.</label><br>
<label><input type="radio" name="q1" value="d"> d) Deliberate disobedience of the law.</label><br>
<label><input type="radio" name="q1" value="e"> e) None of the above.</label><br>
<input type="hidden" name="q1_correct" value="b">
</div><hr>

<div class="question"><p><strong>Q2. What is invincible ignorance?</strong></p>

<label><input type="radio" name="q2" value="b"> b) Indefensible ignorance.</label><br>

<input type="hidden" name="q2_correct" value="a">
</div><hr>

<div class="question"><p><strong>Q3. What type of ignorance were the Jews guilty of?</strong></p>
<label><input type="radio" name="q3" value="a"> a) Vincible ignorance.</label><br>
<label><input type="radio" name="q3" value="b"> b) Invincible ignorance.</label><br>

<label><input type="radio" name="q3" value="d"> d) Total ignorance.</label><br>

<div class="question"><p><strong>Q4. What is the unforgivable sin?</strong></p>
<label><input type="radio" name="q4" value="a"> a) Adultery</label><br>
<label><input type="radio" name="q4" value="b"> b) Paedophilia</label><br>
<label><input type="radio" name="q4" value="c"> c) Setting fire to a church building.</label><br>
<label><input type="radio" name="q4" value="d"> d) Blasphemy against the Holy Spirit.</label><br>
<label><input type="radio" name="q4" value="e"> e) None of the above.</label><br>
<input type="hidden" name="q4_correct" value="d">
</div><hr>

<div class="question"><p><strong>Q5. Which is necessary for forgiveness?</strong></p>
<label><input type="radio" name="q5" value="a"> a) Humility. </label><br>
<label><input type="radio" name="q5" value="b"> b) Repentance.
</label><br>
<label><input type="radio" name="q5" value="c"> c) Generosity. 
</label><br>
<label><input type="radio" name="q5" value="d"> d) Purity.</label><br>
<label><input type="radio" name="q5" value="e"> e) None of the above.</label><br>
<input type="hidden" name="q5_correct" value="b">
</div>
<hr>
<button type="button" onclick="scoreQuiz()">Score Quiz</button>

function disableButtons() {
  for (let i = 1; i <= 5; i++) {
    const btn = document.getElementById(`button${i}`);
    if (btn) btn.disabled = true;
  }
}

function enableButtons() {
  for (let i = 1; i <= 5; i++) {
    const btn = document.getElementById(`button${i}`);
    if (btn) btn.disabled = false;
  }
}

disableButtons();

function scoreQuiz() {
    const form = document.getElementById('quizForm');
    const qs = form.querySelectorAll('.question');
    let total = qs.length;
    let score = 0;

    qs.forEach((div, i) => {
        const q = i + 1;
        const correct = form.querySelector(`input[name=q${q}_correct]`).value;
        const chosen = form.querySelector(`input[name=q${q}]:checked`);
        const labels = div.querySelectorAll('label');

        labels.forEach(l => {
            l.style.background = '';
            l.style.padding = '3px';
        });

        labels.forEach(l => {
            const val = l.querySelector('input').value;

            if (val === correct) {
                l.style.background = 'lightgreen';
            }

            if (chosen && val === chosen.value && val !== correct) {
                l.style.background = 'lightcoral';
            }
        });

        if (chosen && chosen.value === correct) {
            score++;
        }
    }
);

document.getElementById('scoreDisplay').textContent =
        `Score: ${score} / ${total}`;    
}
